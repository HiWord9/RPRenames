name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: build
        run: ./gradlew build "-Pmod_version=$RELEASE_VERSION" --stacktrace
      - name: export maven
        env:
          local_maven_url: file://${{ runner.temp }}/maven
        run: ./gradlew publish "-Pmod_version=$RELEASE_VERSION" --stacktrace
      - name: upload maven
        uses: actions/upload-artifact@v4
        with:
          name: maven
          path: ${{ runner.temp }}/maven
          if-no-files-found: error
      - name: attach jars to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' \
            -exec gh release upload "$TAG" --clobber {} +

  publish-maven:
    needs: release
    uses: ./.github/workflows/publish-maven.yml
    secrets:
      MAVEN_DEPLOY_KEY: ${{ secrets.MAVEN_DEPLOY_KEY }}
